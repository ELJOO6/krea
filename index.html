<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chosen</title>
<style>
  :root{
    --ink:#161c22;
    --blue:#1857c9;
    --blue-dark:#0f3f96;
    --accent:#ff6b4a;
    --accent-dark:#e2502f;
    --gold:#ffcf3f;
    --panel:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    font-family:'Tahoma','Segoe UI',sans-serif;
    background:#000;
    user-select:none;
    overscroll-behavior:none;
  }
  #gameCanvas{display:block;width:100%;height:100%;touch-action:none;}

  #app{position:relative;width:100%;height:100%;}
  #app.force-rotate{
    position:fixed;
    top:0;
    transform-origin:0 0;
    transform:rotate(90deg);
  }

  .screen{
    position:fixed;inset:0;z-index:30;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#7ec8e3,#eaf6ff 70%);
    padding:14px;
  }
  .hidden{display:none !important;}

  .card{
    background:var(--panel);
    border-radius:26px;
    padding:26px 24px 22px;
    width:min(92%,420px);
    max-height:94%;
    overflow-y:auto;
    box-shadow:0 14px 0 rgba(0,0,0,0.12), 0 20px 36px rgba(0,0,0,0.25);
    text-align:center;
    border:6px solid var(--ink);
  }

  .logo{
    font-size:clamp(34px,7vw,46px);font-weight:900;letter-spacing:2px;color:var(--blue);
    text-shadow:3px 3px 0 var(--ink);margin:0 0 2px;line-height:1;
    font-family:'Segoe UI','Tahoma',sans-serif;
  }
  .logo span{color:var(--ink);}
  .subtitle{color:var(--ink);font-size:13px;opacity:.75;margin:2px 0 18px;font-weight:bold;}

  .avatar-wrap{
    width:clamp(120px,32vw,180px);height:clamp(120px,32vw,180px);margin:0 auto 14px;border-radius:50%;
    border:7px solid var(--ink);background:#ffe8b0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
  }
  .avatar-wrap img{width:100%;height:100%;object-fit:cover;}
  .avatar-placeholder{font-size:60px;}

  .upload-btn{
    display:inline-block;background:var(--blue);color:#fff;font-weight:bold;font-size:13px;
    padding:9px 16px;border-radius:14px;cursor:pointer;border:none;margin-bottom:14px;
  }
  #photoInput{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .name-input{
    width:100%;padding:11px 13px;border-radius:14px;border:3px solid var(--ink);
    font-size:14px;text-align:center;margin-bottom:14px;font-family:inherit;font-weight:bold;color:var(--ink);
  }
  .name-input:focus{outline:none;border-color:var(--blue);}

  .btn-primary{
    width:100%;background:var(--blue);color:#fff;font-size:18px;font-weight:900;
    padding:14px;border-radius:16px;border:none;border-bottom:6px solid var(--blue-dark);
    cursor:pointer;letter-spacing:1px;
  }
  .btn-primary:active{border-bottom-width:2px;transform:translateY(4px);}

  .btn-secondary{
    width:100%;background:#eef2f5;color:var(--ink);font-size:14px;font-weight:bold;
    padding:11px;border-radius:14px;border:none;border-bottom:5px solid #c9d3d9;cursor:pointer;margin-top:9px;
  }
  .btn-secondary:active{border-bottom-width:2px;transform:translateY(3px);}

  .howto{text-align:right;font-size:12px;color:var(--ink);background:#f4f7f9;border-radius:14px;padding:10px 13px;margin-top:14px;line-height:1.85;}
  .howto b{color:var(--blue);}

  .result-emoji{font-size:56px;margin-bottom:4px;}
  .result-title{font-size:24px;font-weight:900;color:var(--ink);margin:0 0 6px;}
  .result-stats{font-size:14px;color:var(--ink);opacity:.8;margin-bottom:16px;}

  /* ---------- Instruction screen ---------- */
  #instructionScreen{
    background:linear-gradient(160deg,#ff9a5a,#ff6b4a 45%,#7a3fd6 100%);
  }
  .instr-card{
    background:#fff8ec;border-radius:28px;border:6px solid var(--ink);
    padding:24px 22px;width:min(92%,440px);max-height:92%;overflow-y:auto;
    box-shadow:0 16px 0 rgba(0,0,0,.18);text-align:center;
    animation:instrPop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes instrPop{0%{transform:scale(.7) translateY(30px);opacity:0;}100%{transform:scale(1) translateY(0);opacity:1;}}
  .instr-title{
    font-size:22px;font-weight:900;color:var(--accent-dark);margin:0 0 4px;
    animation:instrWiggle 2.2s ease-in-out infinite;
  }
  @keyframes instrWiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-2deg);}75%{transform:rotate(2deg);}}
  .instr-sub{font-size:14px;color:var(--ink);font-weight:bold;margin-bottom:16px;opacity:.85;}
  .instr-list{list-style:none;margin:0 0 18px;padding:0;text-align:right;}
  .instr-list li{
    background:#fff;border:2px solid #ffdca0;border-radius:14px;padding:12px 14px;margin-bottom:10px;
    font-size:14.5px;font-weight:bold;color:var(--ink);line-height:1.6;
    box-shadow:0 3px 0 rgba(0,0,0,.06);
  }
  .instr-list li b{color:var(--blue);}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:10px 12px;z-index:10;pointer-events:none;font-weight:900;color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,.35);
    direction:ltr;
  }
  .hud-left,.hud-right{display:flex;gap:8px;pointer-events:auto;}
  .hud-pill{
    background:rgba(34,48,59,.55);padding:7px 12px;border-radius:12px;font-size:14px;
    display:flex;align-items:center;gap:5px;
  }
  .hearts{display:flex;gap:2px;font-size:15px;}
  #soundBtn{
    background:rgba(34,48,59,.55);width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
  }

  /* ---------- Touch controls (LTR-anchored, screen-corner fixed regardless of page direction) ---------- */
  #controls{
    position:fixed;inset:0;z-index:10;pointer-events:none;
  }
  #controls.no-touch{display:none !important;}
  .pad{
    position:absolute;left:14px;bottom:16px;
    display:flex;flex-direction:row;gap:clamp(10px,3vw,16px);align-items:center;
    direction:ltr;pointer-events:auto;
  }
  .action-pad{
    position:absolute;right:14px;bottom:16px;
    display:flex;flex-direction:column;gap:clamp(8px,2.4vw,12px);align-items:center;
    direction:ltr;pointer-events:auto;
  }
  .ctrl-btn{
    width:clamp(72px,14vw,96px);height:clamp(72px,14vw,96px);border-radius:50%;background:rgba(255,255,255,.5);
    border:3px solid rgba(34,48,59,.55);font-size:clamp(26px,5vw,34px);display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .ctrl-btn:active{background:rgba(255,255,255,.85);}
  #jumpBtn{
    width:clamp(72px,14vw,96px);height:clamp(72px,14vw,96px);background:#ffe600;border:3px solid rgba(34,48,59,.7);
    font-size:clamp(28px,5.5vw,36px);font-weight:900;color:var(--ink);
    box-shadow:0 0 0 3px rgba(255,230,0,.35);
  }
  #attackBtn{
    width:clamp(60px,11vw,78px);height:clamp(60px,11vw,78px);background:rgba(107,143,255,.75);border:3px solid rgba(34,48,59,.6);
    color:#fff;position:relative;
  }
  #attackBtn .plus{width:22px;height:22px;position:relative;}
  #attackBtn .plus::before,#attackBtn .plus::after{content:'';position:absolute;background:#fff;border-radius:2px;}
  #attackBtn .plus::before{width:22px;height:6px;top:8px;left:0;}
  #attackBtn .plus::after{width:6px;height:22px;top:0;left:8px;}

  /* ---------- Enemy / block dialog ---------- */
  #enemyDialog{
    position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;
    background:rgba(20,25,30,.45);
  }
  .dialog-card{
    background:#fff;border-radius:22px;border:6px solid var(--ink);padding:24px 22px;
    width:min(85%,340px);text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.15);
    animation:dialogPop .28s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes dialogPop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .dialog-emoji{font-size:44px;margin-bottom:6px;}
  .dialog-text{font-size:16px;font-weight:900;color:var(--ink);margin-bottom:16px;}
  .dialog-ok{
    width:100%;background:#3f9142;color:#fff;font-size:18px;font-weight:900;padding:14px;
    border-radius:14px;border:none;border-bottom:5px solid #2d6d31;cursor:pointer;
  }
  .dialog-ok:active{border-bottom-width:2px;transform:translateY(3px);}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;top:20%;transform:translate(-50%,0);
    background:rgba(34,48,59,.85);color:#fff;padding:10px 18px;border-radius:14px;
    font-weight:900;font-size:14px;z-index:22;opacity:0;transition:opacity .25s, transform .25s;
    pointer-events:none;
  }
  #toast.show{opacity:1;transform:translate(-50%,10px);}

  /* ---------- Final cinematic ---------- */
  #cinematicScreen{
    position:fixed;inset:0;z-index:35;background:rgba(6,10,16,0);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    text-align:center;padding:24px;transition:background .5s;
  }
  #cinematicScreen.show{background:rgba(6,10,16,.85);}
  .cine-stage{position:relative;width:220px;height:150px;}
  .cine-frag{
    position:absolute;top:50%;left:50%;
    width:auto;height:70px;
    filter:drop-shadow(0 0 10px #ffe27a);
    transition:transform 1s cubic-bezier(.3,.8,.3,1), opacity .5s .7s;
    opacity:1;
  }
  .cine-frag.f1{transform:translate(calc(-50% - 140px),calc(-50% - 90px)) rotate(-20deg);}
  .cine-frag.f2{transform:translate(calc(-50% + 120px),calc(-50% - 70px)) rotate(15deg);}
  .cine-frag.f3{transform:translate(calc(-50% + 0px),calc(-50% + 100px)) rotate(5deg);}
  .cine-frag.merged{transform:translate(-50%,-50%) rotate(0deg) scale(0.4);opacity:0;}
  .cine-key-backdrop{
    position:absolute;top:50%;left:50%;
    width:380px;height:380px;
    transform:translate(-50%,-50%) scale(.5);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,250,235,0.55) 42%, rgba(255,250,235,0) 72%);
    opacity:0;
    transition:opacity .8s, transform .8s;
    pointer-events:none;
  }
  .cine-key-backdrop.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .cine-key{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.4);
    width:280px;height:auto;
    filter:drop-shadow(0 0 18px #ffe27a) drop-shadow(0 0 36px #ffcf3f);
    opacity:0;
    transition:opacity .6s, transform .6s;
  }
  .cine-key.show{opacity:1;transform:translate(-50%,-50%) scale(1);animation:keyPulse 1.6s ease-in-out infinite .6s;}
  @keyframes keyPulse{
    0%,100%{filter:drop-shadow(0 0 18px #ffe27a) drop-shadow(0 0 36px #ffcf3f);}
    50%{filter:drop-shadow(0 0 30px #fff2b0) drop-shadow(0 0 56px #ffcf3f);}
  }
  .cine-ring{
    position:absolute;top:50%;left:50%;width:130px;height:130px;
    transform:translate(-50%,-50%) rotate(0deg);
    border-radius:50%;opacity:0;
    background:repeating-conic-gradient(from 0deg,#ffe27a 0deg 8deg,transparent 8deg 20deg);
    -webkit-mask:radial-gradient(circle,transparent 52px,#000 54px,#000 62px,transparent 64px);
    mask:radial-gradient(circle,transparent 52px,#000 54px,#000 62px,transparent 64px);
    transition:opacity .6s;
    animation:ringSpin 8s linear infinite;
  }
  .cine-ring.show{opacity:.9;}
  @keyframes ringSpin{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}
  .cine-sparkle{
    position:absolute;color:#ffe27a;font-size:18px;opacity:0;
    animation:sparkleTwinkle 1.6s ease-in-out infinite;
  }
  @keyframes sparkleTwinkle{
    0%,100%{opacity:0;transform:scale(.4) translateY(0);}
    50%{opacity:1;transform:scale(1) translateY(-6px);}
  }
  .cine-message{
    color:#fff;font-size:19px;font-weight:900;max-width:360px;line-height:1.7;
    opacity:0;transform:translateY(10px);transition:opacity .6s, transform .6s;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .cine-message.show{opacity:1;transform:translateY(0);}
  .cine-buttons{
    display:flex;flex-direction:column;gap:10px;width:min(80%,300px);
    opacity:0;transform:translateY(10px);transition:opacity .5s, transform .5s;
  }
  .cine-buttons.show{opacity:1;transform:translateY(0);}
</style>
</head>
